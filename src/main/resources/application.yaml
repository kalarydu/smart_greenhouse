  address: 0.0.0.0

# ========== 大棚 & 报警 & 自动控制配置 ==========
greenhouse:
  default-id: 1  # 硬件上报消息缺少 greenhouseId 时默认使用的大棚ID
  save-interval-minutes: 1  # 传感器数据落库间隔（分钟），报警和自动控制仍然是实时检测

  alert:
    enabled: true
    dedup-hours: 2  # 同一大棚+同一报警类型，2小时内不重复生成
    thresholds:
      temperature-low: 15.0       # ℃，低于此值 → TEMP_LOW
      temperature-high: 35.0      # ℃，高于此值 → TEMP_HIGH
      humidity-low: 40.0          # %，低于此值 → HUMIDITY_LOW
      humidity-high: 90.0         # %，高于此值 → HUMIDITY_HIGH
      co2-low: 300.0              # ppm，低于此值 → CO2_LOW
      co2-high: 1000.0            # ppm，高于此值 → CO2_HIGH
      light-low: 500.0           # Lux，低于此值 → LIGHT_LOW
      soil-moisture-low: 30.0     # %，低于此值 → SOIL_MOISTURE_LOW
      soil-moisture-high: 80.0    # %，高于此值 → SOIL_MOISTURE_HIGH
      soil-ph-low: 5.5            # 低于此值 → SOIL_PH_LOW
      soil-ph-high: 7.5           # 高于此值 → SOIL_PH_HIGH

  auto-control:
    enabled: true
    cooldown-minutes: 5  # 同一设备操作冷却时间（分钟），避免频繁开关
    thresholds:
      temperature-high: 30.0   # ℃，高于此值 → 自动开启风机
      light-low: 500.0        # Lux，低于此值 → 自动开启补光灯

    # ========== 作物图像定时分类配置 ==========
    classification:
      enabled: true                      # 是否启用定时分类
      interval-seconds: 30               # 定时拉取间隔（秒）
      batch-size-per-greenhouse: 3       # 每棚每轮拉取数量
      greenhouses:
        - key: cotton                    # 棉花大棚
          name: "棉花大棚"
          prefixes:
            - test/cotton_flowering
            - test/cotton_fruit
            - test/cotton_plant
            - test/cotton_seedling
            - test/cotton_sprout
        - key: sunflower                 # 向日葵大棚
          name: "向日葵大棚"
          prefixes:
            - test/sunflower_earlyBloom
            - test/sunflower_healthy
        - key: strawberry                # 草莓大棚
          name: "草莓大棚"
          prefixes:
            - test/strawberry_flowering
            - test/strawberry_fruiting
            - test/strawberry_growing
            - test/strawberry_mature

