# ========== MyBatis Plus 配置 ==========
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ========== 服务器端口 ==========
server:
  port: 8080

# ========== 报警阈值 & 自动控制配置 ==========
greenhouse:
  alert:
    enabled: true
    dedup-hours: 2  # 同一大棚+同一报警类型，2小时内不重复生成
    thresholds:
      temperature-low: 15.0       # ℃，低于此值 → TEMP_LOW
      temperature-high: 35.0      # ℃，高于此值 → TEMP_HIGH
      humidity-low: 40.0          # %，低于此值 → HUMIDITY_LOW
      humidity-high: 90.0         # %，高于此值 → HUMIDITY_HIGH
      co2-low: 300.0              # ppm，低于此值 → CO2_LOW
      co2-high: 1000.0            # ppm，高于此值 → CO2_HIGH
      light-low: 5000.0           # Lux，低于此值 → LIGHT_LOW
      soil-moisture-low: 30.0     # %，低于此值 → SOIL_MOISTURE_LOW
      soil-moisture-high: 80.0    # %，高于此值 → SOIL_MOISTURE_HIGH
      soil-ph-low: 5.5            # 低于此值 → SOIL_PH_LOW
      soil-ph-high: 7.5           # 高于此值 → SOIL_PH_HIGH

  auto-control:
    enabled: true
    cooldown-minutes: 5  # 同一设备操作冷却时间（分钟），避免频繁开关
    thresholds:
      temperature-high: 30.0   # ℃，高于此值 → 自动开启风机
      light-low: 10000.0       # Lux，低于此值 → 自动开启补光灯

# ========== DeepSeek AI 配置 ==========
