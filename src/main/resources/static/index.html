<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧大棚管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; background: #f0f2f5; display: flex; min-height: 100vh; }

        /* 左侧导航 */
        .sidebar { width: 200px; background: #001529; color: #fff; padding-top: 20px; flex-shrink: 0; }
        .sidebar .logo { text-align: center; font-size: 18px; font-weight: bold; padding: 0 16px 20px; border-bottom: 1px solid #002b5c; margin-bottom: 8px; }
        .sidebar .logo span { font-size: 24px; }
        .sidebar .tab { display: block; width: 100%; padding: 14px 24px; text-align: left; border: none; background: none; color: #ffffffa6; cursor: pointer; font-size: 15px; transition: .2s; }
        .sidebar .tab:hover, .sidebar .tab.active { color: #fff; background: #1890ff; }

        /* 右侧主区域 */
        .main { flex: 1; padding: 24px; overflow-y: auto; }
        .page-title { font-size: 22px; font-weight: bold; margin-bottom: 20px; color: #333; }

        /* 卡片 */
        .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        .card h3 { font-size: 16px; margin-bottom: 16px; color: #333; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; }

        /* 表单 */
        .form-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; }
        .form-row label { display: flex; flex-direction: column; font-size: 13px; color: #666; gap: 4px; min-width: 140px; }
        .form-row input, .form-row select { padding: 7px 10px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; }
        .form-row input:focus, .form-row select:focus { outline: none; border-color: #1890ff; box-shadow: 0 0 0 2px rgba(24,144,255,.2); }

        /* 按钮 */
        .btn { padding: 7px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; transition: .2s; }
        .btn-primary { background: #1890ff; color: #fff; }
        .btn-primary:hover { background: #40a9ff; }
        .btn-danger { background: #ff4d4f; color: #fff; }
        .btn-danger:hover { background: #ff7875; }
        .btn-success { background: #52c41a; color: #fff; }
        .btn-success:hover { background: #73d13d; }
        .btn-warning { background: #faad14; color: #fff; }
        .btn-warning:hover { background: #ffc53d; }
        .btn-sm { padding: 3px 10px; font-size: 12px; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

        /* 表格 */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #f0f0f0; }
        th { background: #fafafa; color: #666; font-weight: 600; white-space: nowrap; }
        tr:hover { background: #f5f5f5; }
        .empty-row td { text-align: center; padding: 40px; color: #999; }

        /* 分页 */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 16px; }
        .pagination button { padding: 5px 12px; border: 1px solid #d9d9d9; background: #fff; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .pagination button:hover { border-color: #1890ff; color: #1890ff; }
        .pagination button:disabled { color: #d9d9d9; cursor: not-allowed; }
        .pagination span { font-size: 13px; color: #666; }

        /* 消息提示 */
        .toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 4px; color: #fff; font-size: 14px; z-index: 9999; animation: fadeIn .3s; }
        .toast-success { background: #52c41a; }
        .toast-error { background: #ff4d4f; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* 状态标签 */
        .tag { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 12px; }
        .tag-on { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }
        .tag-off { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; }
        .tag-pending { background: #fff7e6; color: #fa8c16; border: 1px solid #ffd591; }
        .tag-done { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; }

        /* 搜索区 */
        .search-bar { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
        .search-bar label { display: flex; flex-direction: column; font-size: 12px; color: #888; gap: 3px; }
        .search-bar input, .search-bar select { padding: 6px 10px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 13px; }

        .hidden { display: none; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: #fff; border-radius: 8px; padding: 24px; min-width: 420px; max-width: 600px; box-shadow: 0 4px 20px rgba(0,0,0,.15); }
        .modal h3 { margin-bottom: 16px; }

        /* AI 聊天 */
        .chat-container { display: flex; flex-direction: column; height: calc(100vh - 130px); }
        .chat-messages { flex: 1; overflow-y: auto; padding: 16px; background: #fafafa; border-radius: 8px; margin-bottom: 12px; max-height: 60vh; }
        .chat-msg { margin-bottom: 16px; display: flex; gap: 10px; }
        .chat-msg.user { flex-direction: row-reverse; }
        .chat-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .chat-avatar.ai { background: #e6f7ff; }
        .chat-avatar.user { background: #1890ff; color: #fff; }
        .chat-bubble { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
        .chat-bubble.ai { background: #fff; border: 1px solid #e8e8e8; border-radius: 4px 12px 12px 12px; }
        .chat-bubble.user { background: #1890ff; color: #fff; border-radius: 12px 4px 12px 12px; }
        .chat-input-area { display: flex; gap: 10px; }
        .chat-input-area textarea { flex: 1; padding: 10px 14px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 14px; resize: none; font-family: inherit; }
        .chat-input-area textarea:focus { outline: none; border-color: #1890ff; }
        .chat-input-area button { padding: 10px 24px; border: none; border-radius: 8px; background: #1890ff; color: #fff; cursor: pointer; font-size: 15px; white-space: nowrap; }
        .chat-input-area button:hover { background: #40a9ff; }
        .chat-input-area button:disabled { background: #d9d9d9; cursor: not-allowed; }
        .typing-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #bbb; animation: typing 1.4s infinite; margin: 0 2px; }
        .typing-dot:nth-child(2) { animation-delay: .2s; }
        .typing-dot:nth-child(3) { animation-delay: .4s; }
        @keyframes typing { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }

        /* 作物监测卡片 */
        .crop-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .crop-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); overflow: hidden; transition: .2s; }
        .crop-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.12); transform: translateY(-2px); }
        .crop-card-header { padding: 16px 20px; color: #fff; display: flex; align-items: center; gap: 10px; }
        .crop-card-header.strawberry { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
        .crop-card-header.sunflower { background: linear-gradient(135deg, #f9ca24, #f0932b); }
        .crop-card-header.cotton { background: linear-gradient(135deg, #a4b0be, #747d8c); }
        .crop-card-header .crop-icon { font-size: 32px; }
        .crop-card-header .crop-name { font-size: 20px; font-weight: bold; }
        .crop-card-body { padding: 16px 20px; }
        .crop-result { text-align: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .crop-result .stage { font-size: 24px; font-weight: bold; color: #333; margin: 8px 0; }
        .crop-result .confidence { font-size: 14px; color: #888; }
        .confidence-bar { height: 8px; background: #f0f0f0; border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .confidence-bar-fill { height: 100%; border-radius: 4px; transition: width .5s; }
        .conf-high { background: #52c41a; }
        .conf-mid { background: #faad14; }
        .conf-low { background: #ff4d4f; }
        .crop-meta { font-size: 12px; color: #999; margin-top: 10px; }
        .crop-history { margin-top: 12px; }
        .crop-history table { font-size: 12px; }
        .crop-history th, .crop-history td { padding: 6px 8px; }
        .crop-empty { text-align: center; padding: 30px; color: #bbb; }
        .sse-status { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; font-size: 13px; }
        .sse-dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; }
        .sse-dot.connected { background: #52c41a; animation: pulse 2s infinite; }
        .sse-dot.disconnected { background: #ff4d4f; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        @media (max-width: 900px) { .crop-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<!-- 左侧导航 -->
<nav class="sidebar">
    <div class="logo"><span>🌱</span><br>智慧大棚</div>
    <button class="tab active" data-page="greenhouse">🏠 大棚管理</button>
    <button class="tab" data-page="sensor">🌡️ 传感器数据</button>
    <button class="tab" data-page="device">⚙️ 设备管理</button>
    <button class="tab" data-page="alert">🔔 报警记录</button>
    <button class="tab" data-page="crops">🌾 作物监测</button>
    <button class="tab" data-page="ai">🤖 AI助手</button>
</nav>

<!-- 右侧主区域 -->
<div class="main" id="mainContent"></div>

<script>
// ==================== 基础工具 ====================
const API = {
    get: (url) => fetch(url).then(r => r.json()),
    post: (url, data) => fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) }).then(r => r.json()),
    put: (url, data) => fetch(url, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) }).then(r => r.json()),
    del: (url) => fetch(url, { method:'DELETE' }).then(r => r.json()),
};

function toast(msg, type='success') {
    const t = document.createElement('div');
    t.className = `toast toast-${type}`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2500);
}

function formatTime(t) { return t ? t.replace('T',' ').substring(0,19) : '-'; }

// ==================== 页面切换 ====================
let snAutoRefreshTimer = null;  // 传感器页面自动刷新定时器

document.querySelectorAll('.sidebar .tab').forEach(btn => {
    btn.addEventListener('click', () => {
        // 切页面时清除上一个页面的定时器
        if (snAutoRefreshTimer) { clearInterval(snAutoRefreshTimer); snAutoRefreshTimer = null; }
        document.querySelectorAll('.sidebar .tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadPage(btn.dataset.page);
    });
});

function loadPage(page) {
    const main = document.getElementById('mainContent');
    switch(page) {
        case 'greenhouse': renderGreenhouse(main); break;
        case 'sensor': renderSensor(main); break;
        case 'device': renderDevice(main); break;
        case 'alert': renderAlert(main); break;
        case 'crops': renderCropMonitor(main); break;
        case 'ai': renderAi(main); break;
    }
}

// ==================== 1. 大棚管理 ====================
function renderGreenhouse(main) {
    main.innerHTML = `
        <div class="page-title">🏠 大棚管理</div>
        <div class="card">
            <h3 id="ghFormTitle">新增大棚</h3>
            <div class="form-row">
                <label>名称 <input id="ghName" placeholder="如：一号大棚"></label>
                <label>位置 <input id="ghLocation" placeholder="如：A区-东侧"></label>
                <label>面积(㎡) <input id="ghArea" type="number" step="0.1" value="200"></label>
                <label>描述 <input id="ghDesc" placeholder="如：番茄种植大棚"></label>
                <label>状态
                    <select id="ghStatus"><option value="1">运行中</option><option value="0">停用</option></select>
                </label>
            </div>
            <input type="hidden" id="ghId">
            <div class="btn-group">
                <button class="btn btn-primary" onclick="saveGreenhouse()">💾 保存</button>
                <button class="btn" onclick="resetGhForm()" style="background:#f5f5f5">↩ 重置</button>
            </div>
        </div>
        <div class="card">
            <h3>大棚列表</h3>
            <div class="search-bar">
                <label>搜索名称 <input id="ghSearch" placeholder="输入大棚名称"></label>
                <button class="btn btn-primary" onclick="loadGreenhouseList(1)">🔍 查询</button>
            </div>
            <table>
                <thead><tr><th>ID</th><th>名称</th><th>位置</th><th>面积(㎡)</th><th>描述</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
                <tbody id="ghTableBody"></tbody>
            </table>
            <div class="pagination" id="ghPagination"></div>
        </div>`;
    loadGreenhouseList(1);
}

function loadGreenhouseList(page) {
    const name = document.getElementById('ghSearch').value;
    let url = `/api/greenhouse/list?page=${page}&size=10`;
    if (name) url += `&name=${encodeURIComponent(name)}`;

    API.get(url).then(res => {
        if (res.code !== 200) { toast(res.message, 'error'); return; }
        const d = res.data;
        const tbody = document.getElementById('ghTableBody');
        if (!d.records || d.records.length === 0) {
            tbody.innerHTML = '<tr class="empty-row"><td colspan="8">暂无数据</td></tr>';
        } else {
            tbody.innerHTML = d.records.map(r => `
                <tr>
                    <td>${r.id}</td>
                    <td><b>${r.name}</b></td>
                    <td>${r.location}</td>
                    <td>${r.area}</td>
                    <td>${r.description || '-'}</td>
                    <td><span class="tag ${r.status===1?'tag-on':'tag-off'}">${r.status===1?'运行中':'停用'}</span></td>
                    <td>${formatTime(r.createTime)}</td>
                    <td class="btn-group">
                        <button class="btn btn-primary btn-sm" onclick="editGreenhouse(${r.id})">编辑</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteGreenhouse(${r.id})">删除</button>
                    </td>
                </tr>`).join('');
        }
        renderPagination('ghPagination', d.current, d.pages, loadGreenhouseList);
    });
}

function editGreenhouse(id) {
    API.get(`/api/greenhouse/${id}`).then(res => {
        if (res.code !== 200) { toast(res.message, 'error'); return; }
        const r = res.data;
        document.getElementById('ghId').value = r.id;
        document.getElementById('ghName').value = r.name;
        document.getElementById('ghLocation').value = r.location;
        document.getElementById('ghArea').value = r.area;
        document.getElementById('ghDesc').value = r.description || '';
        document.getElementById('ghStatus').value = r.status;
        document.getElementById('ghFormTitle').textContent = '编辑大棚';
        document.querySelector('#mainContent').scrollIntoView({ behavior:'smooth' });
    });
}

function resetGhForm() {
    document.getElementById('ghId').value = '';
    document.getElementById('ghName').value = '';
    document.getElementById('ghLocation').value = '';
    document.getElementById('ghArea').value = '200';
    document.getElementById('ghDesc').value = '';
    document.getElementById('ghStatus').value = '1';
    document.getElementById('ghFormTitle').textContent = '新增大棚';
}

function saveGreenhouse() {
    const data = {
        name: document.getElementById('ghName').value.trim(),
        location: document.getElementById('ghLocation').value.trim(),
        area: parseFloat(document.getElementById('ghArea').value) || 0,
        description: document.getElementById('ghDesc').value.trim(),
        status: parseInt(document.getElementById('ghStatus').value),
    };
    if (!data.name) { toast('请输入大棚名称', 'error'); return; }

    const id = document.getElementById('ghId').value;
    const promise = id ? API.put('/api/greenhouse', { ...data, id: parseInt(id) }) : API.post('/api/greenhouse', data);
    promise.then(res => {
        if (res.code === 200) { toast(res.data || '操作成功'); resetGhForm(); loadGreenhouseList(1); }
        else toast(res.message, 'error');
    });
}

function deleteGreenhouse(id) {
    if (!confirm('确定删除该大棚吗？（逻辑删除，可恢复）')) return;
    API.del(`/api/greenhouse/${id}`).then(res => {
        if (res.code === 200) { toast('删除成功'); loadGreenhouseList(1); }
        else toast(res.message, 'error');
    });
}

// ==================== 2. 传感器数据 ====================
const METRICS = [
    { key: 'temperature',    label: '温度',       unit: '℃' },
    { key: 'humidity',       label: '空气湿度',   unit: '%' },
    { key: 'lightIntensity', label: '光照强度',   unit: 'Lux' },
    { key: 'co2Concentration',label: 'CO2浓度',   unit: 'ppm' },
    { key: 'soilMoisture',   label: '土壤湿度',   unit: '%' },
    { key: 'soilPh',         label: '土壤pH',     unit: '' },
];
const CHART_COLORS = ['#1890ff', '#52c41a', '#faad14', '#ff4d4f', '#722ed1', '#13c2c2', '#eb2f96', '#fa8c16'];
let snCurrentMetric = 'temperature';
let snGreenhouseIds = [];
let snChart = null;

function renderSensor(main) {
    main.innerHTML = `
        <div class="page-title">🌡️ 传感器数据</div>

        <!-- 指标选择 -->
        <div class="card">
            <h3>📊 对比指标</h3>
            <div class="btn-group" id="snMetricBtns"></div>
        </div>

        <!-- 大棚选择 -->
        <div class="card">
            <h3>🏠 大棚选择</h3>
            <div class="btn-group" id="snGhCheckboxes">
                <span style="color:#999;font-size:13px">加载中...</span>
            </div>
        </div>

        <!-- 时间范围 -->
        <div class="card">
            <h3>📅 时间范围</h3>
            <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
                <div class="btn-group" id="snTimeBtns"></div>
                <label style="font-size:13px;color:#666">自定义:
                    <input type="datetime-local" id="snStartTime">
                </label>
                <label style="font-size:13px;color:#666">至
                    <input type="datetime-local" id="snEndTime">
                </label>
                <button class="btn btn-primary btn-sm" onclick="snApplyCustomTime()">查询</button>
            </div>
        </div>

        <!-- 折线图 -->
        <div class="card">
            <h3>📈 趋势图</h3>
            <div style="position:relative;height:380px">
                <canvas id="snChartCanvas"></canvas>
            </div>
            <div id="snChartEmpty" class="hidden" style="text-align:center;padding:60px;color:#999">暂无数据</div>
        </div>

        <!-- 数据列表 -->
        <div class="card">
            <h3>📋 数据列表</h3>
            <div class="search-bar">
                <label>大棚ID <input id="snSearchGid" type="number" placeholder="筛选大棚"></label>
                <button class="btn btn-primary" onclick="loadSensorList(1)">🔍 查询</button>
            </div>
            <table>
                <thead><tr><th>ID</th><th>大棚ID</th><th>温度℃</th><th>湿度%</th><th>光照Lux</th><th>CO2ppm</th><th>土壤湿度%</th><th>土壤pH</th><th>记录时间</th><th>操作</th></tr></thead>
                <tbody id="snTableBody"></tbody>
            </table>
            <div class="pagination" id="snPagination"></div>
        </div>`;

    // 初始化指标按钮
    initMetricButtons();
    // 加载大棚列表
    loadGreenhouseCheckboxes();
    // 初始化时间范围按钮
    initTimeButtons();
    // 初始加载图表（近7天）
    snApplyPreset('7d');
    // 加载下方列表
    loadSensorList(1);

    // 启动自动刷新：每 10 秒刷新图表和数据列表（仅刷新第一页，不重置翻页）
    snAutoRefreshTimer = setInterval(() => {
        refreshChart();
        const gid = document.getElementById('snSearchGid').value;
        let url = `/api/sensor-data/list?page=1&size=10`;
        if (gid) url += `&greenhouseId=${gid}`;
        API.get(url).then(res => {
            if (res.code === 200) updateSensorTable(res.data);
        });
    }, 10000);
}

// ========== 指标按钮 ==========
function initMetricButtons() {
    const container = document.getElementById('snMetricBtns');
    container.innerHTML = METRICS.map((m, i) => {
        const active = m.key === snCurrentMetric;
        return `<button class="btn btn-sm" style="${active ? 'background:#1890ff;color:#fff' : 'background:#f5f5f5'}"
                onclick="snSelectMetric('${m.key}')">${m.label}</button>`;
    }).join('');
}

function snSelectMetric(key) {
    snCurrentMetric = key;
    initMetricButtons();
    refreshChart();
}

// ========== 大棚选择 ==========
function loadGreenhouseCheckboxes() {
    API.get('/api/greenhouse/list?page=1&size=100').then(res => {
        const container = document.getElementById('snGhCheckboxes');
        if (res.code !== 200 || !res.data.records || res.data.records.length === 0) {
            container.innerHTML = '<span style="color:#999;font-size:13px">无大棚数据</span>';
            return;
        }
        // 按ID升序排列（一号大棚在前）
        const records = res.data.records.sort((a, b) => a.id - b.id);
        // 首次默认全选
        if (snGreenhouseIds.length === 0) {
            snGreenhouseIds = records.map(r => r.id);
        }
        container.innerHTML = records.map(r => {
            const checked = snGreenhouseIds.includes(r.id) ? 'checked' : '';

function initTimeButtons() {
    document.getElementById('snTimeBtns').innerHTML = `
        <button class="btn btn-sm" onclick="snApplyPreset('1d')">今天</button>
        <button class="btn btn-sm" onclick="snApplyPreset('3d')">近3天</button>
        <button class="btn btn-sm" style="background:#1890ff;color:#fff" id="snBtn7d" onclick="snApplyPreset('7d')">近7天</button>
    `;
}

function snApplyPreset(days) {
    // 高亮对应按钮
    document.querySelectorAll('#snTimeBtns button').forEach(b => b.style.background = '#f5f5f5');
    document.querySelectorAll('#snTimeBtns button').forEach(b => b.style.color = '#000');
    const target = document.querySelector(`#snTimeBtns button:nth-child(${days === '1d' ? 1 : days === '3d' ? 2 : 3})`);
    if (target) { target.style.background = '#1890ff'; target.style.color = '#fff'; }

    const now = new Date();
    const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
    let start;
    if (days === '1d') {
        start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);
    } else if (days === '3d') {
        start = new Date(now);
        start.setDate(start.getDate() - 2);
        start.setHours(0, 0, 0, 0);
    } else {
        start = new Date(now);
        start.setDate(start.getDate() - 6);
        start.setHours(0, 0, 0, 0);
    }

    document.getElementById('snStartTime').value = toLocalDatetimeStr(start);
    document.getElementById('snEndTime').value = toLocalDatetimeStr(end);
    refreshChart();
}

function snApplyCustomTime() {
    // 取消预设高亮
    document.querySelectorAll('#snTimeBtns button').forEach(b => { b.style.background = '#f5f5f5'; b.style.color = '#000'; });
    refreshChart();
}

function toLocalDatetimeStr(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    const h = String(date.getHours()).padStart(2, '0');
    const min = String(date.getMinutes()).padStart(2, '0');
    return `${y}-${m}-${d}T${h}:${min}`;
}

// ========== 图表刷新 ==========
function refreshChart() {
    if (snGreenhouseIds.length === 0) {
        destroyChart();
        document.getElementById('snChartEmpty').classList.remove('hidden');
        return;
    }

    const start = document.getElementById('snStartTime').value;
    const end = document.getElementById('snEndTime').value;

    let url = `/api/sensor-data/chart?metric=${snCurrentMetric}&greenhouseIds=${snGreenhouseIds.join(',')}`;
    if (start) url += `&startTime=${start}:00`;
    if (end) url += `&endTime=${end}:00`;

    API.get(url).then(res => {
        if (res.code !== 200) { toast(res.message, 'error'); return; }
        const d = res.data;
        if (!d.series || d.series.length === 0 || d.series.every(s => s.dataPoints.length === 0)) {
            destroyChart();
            document.getElementById('snChartEmpty').classList.remove('hidden');
            return;
        }
        document.getElementById('snChartEmpty').classList.add('hidden');
        drawChart(d);
    });
}

function drawChart(data) {
    destroyChart();

    const metricInfo = METRICS.find(m => m.key === data.metric) || { label: data.metric, unit: '' };
    const datasets = data.series.map((s, i) => ({
        label: s.greenhouseName,
        data: s.dataPoints.map(p => ({ x: p.recordTime, y: p.value })),
        borderColor: CHART_COLORS[i % CHART_COLORS.length],
        backgroundColor: CHART_COLORS[i % CHART_COLORS.length] + '20',
        tension: 0.3,
        pointRadius: s.dataPoints.length < 50 ? 3 : 0,
        pointHoverRadius: 5,
        borderWidth: 2,
    }));

    const ctx = document.getElementById('snChartCanvas').getContext('2d');
    snChart = new Chart(ctx, {
        type: 'line',
        data: { datasets },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'top' },
                tooltip: {
                    callbacks: {
                        label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y} ${metricInfo.unit}`,
                    }
                }
            },
            scales: {
                x: {
                    type: 'time',
                    time: {
                        displayFormats: { hour: 'MM-dd HH:mm', day: 'MM-dd' },
                        tooltipFormat: 'yyyy-MM-dd HH:mm',
                    },
                    title: { display: true, text: '时间' },
                },
                y: {
                    title: { display: true, text: `${metricInfo.label} (${metricInfo.unit})` },
                    beginAtZero: false,
                }
            }
        }
    });
}

function destroyChart() {
    if (snChart) { snChart.destroy(); snChart = null; }
}

                        <tbody id="cropHistory_${g.key}"></tbody>
                    </table>
                </div>
            </div>
        </div>`).join('');
}

function connectSSE() {
    if (sseConnection) { sseConnection.close(); sseConnection = null; }

    sseConnection = new EventSource('/api/classification/stream');

    sseConnection.onopen = () => {
        document.getElementById('sseDot').className = 'sse-dot connected';
        document.getElementById('sseStatusText').textContent = '已连接';
    };

    sseConnection.addEventListener('classification', (e) => {
        try {
            const payload = JSON.parse(e.data);
            const results = payload.data || [];
            document.getElementById('sseUpdateTime').textContent =
                '上次更新: ' + new Date().toLocaleTimeString();

            // 按大棚 key 分组
            const grouped = {};
            results.forEach(r => {
                if (!grouped[r.greenhouseKey]) grouped[r.greenhouseKey] = [];
                grouped[r.greenhouseKey].push(r);
            });

            // 更新每个大棚的最新结果
            for (const [key, items] of Object.entries(grouped)) {
                updateCropCard(key, items[0]); // 只显示最新的
            }

            // 刷新历史表
            loadCropHistory();

        } catch (err) {
            console.error('SSE 解析失败:', err);
        }
    });

    sseConnection.onerror = () => {
        document.getElementById('sseDot').className = 'sse-dot disconnected';
        document.getElementById('sseStatusText').textContent = '连接断开，10秒后重连...';
        sseConnection.close();
        setTimeout(connectSSE, 10000);
    };
}

function updateCropCard(key, data) {
    const resultDiv = document.getElementById('cropResult_' + key);
    const metaDiv = document.getElementById('cropMeta_' + key);
    if (!resultDiv || !data) return;

    const confClass = data.confidence >= 0.8 ? 'conf-high' : data.confidence >= 0.5 ? 'conf-mid' : 'conf-low';
    const confPct = (data.confidence * 100).toFixed(1);

    resultDiv.innerHTML = `
        <div style="font-size:12px;color:#888;margin-bottom:4px;">📷 ${data.fileName}</div>
        <div class="stage">${data.classNameCn}</div>
        <div class="confidence">置信度 ${confPct}%</div>
        <div class="confidence-bar"><div class="confidence-bar-fill ${confClass}" style="width:${confPct}%"></div></div>`;

    metaDiv.innerHTML = `推理耗时: ${data.elapsedMs}ms | ${new Date().toLocaleTimeString()}`;
}

function loadCropHistory() {
    CROP_GREENHOUSES.forEach(g => {
        API.get('/api/classification/recent/' + g.key + '?limit=8').then(res => {
            if (res.code !== 200) return;
            const tbody = document.getElementById('cropHistory_' + g.key);
            if (!tbody) return;
            const data = res.data || [];
            if (data.length === 0) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="3">暂无记录</td></tr>';
            } else {
                tbody.innerHTML = data.map(r => `
                    <tr>
                        <td>${formatTime(r.createTime)}</td>
                        <td><b>${r.classNameCn}</b></td>
                        <td>${(r.confidence*100).toFixed(1)}%</td>
                    </tr>`).join('');
            }
        });
    });
}

async function sendAiMessage() {
    const input = document.getElementById('aiInput');
    const sendBtn = document.getElementById('aiSendBtn');
    const message = input.value.trim();
    if (!message) return;

    // 显示用户消息
    appendMessage('user', message);
    input.value = '';
    input.focus();

    // 显示加载动画
    const loadingId = appendLoading();

    // 禁用发送按钮
    sendBtn.disabled = true;
    sendBtn.textContent = '⏳ 思考中...';

    try {
        const res = await API.post('/api/ai/chat', { message: message });
        removeLoading(loadingId);
        if (res.code === 200) {
            appendMessage('ai', res.data.reply);
        } else {
            appendMessage('ai', '抱歉，出错了：' + (res.message || '未知错误'));
        }
    } catch (e) {
        removeLoading(loadingId);
        appendMessage('ai', '抱歉，网络请求失败，请检查网络连接。');
    }

    sendBtn.disabled = false;
    sendBtn.textContent = '📨 发送';
}

    const container = document.getElementById('aiMessages');
    const div = document.createElement('div');

    div.innerHTML = `

    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

function appendLoading() {
    const container = document.getElementById('aiMessages');
    const id = 'loading-' + Date.now();

}

function removeLoading(id) {
    const el = document.getElementById(id);

function escapeHtml(text) {
    const div = document.createElement('div');

                        <option value="1">已处理</option>
                    </select>
                </label>
                <button class="btn btn-primary" onclick="loadAlertList(1)">🔍 查询</button>
            </div>
            <table>
                <thead><tr><th>ID</th><th>大棚ID</th><th>类型</th><th>内容</th><th>状态</th><th>报警时间</th><th>处理时间</th><th>操作</th></tr></thead>
                <tbody id="alTableBody"></tbody>
            </table>
            <div class="pagination" id="alPagination"></div>
        </div>`;
    loadAlertList(1);
}

const alertTypeMap = {
    TEMP_HIGH:'温度过高', TEMP_LOW:'温度过低',
    HUMIDITY_HIGH:'湿度过高', HUMIDITY_LOW:'湿度过低',
    CO2_HIGH:'CO2过高', CO2_LOW:'CO2过低',
    LIGHT_LOW:'光照不足',
    SOIL_MOISTURE_HIGH:'土壤湿度过高', SOIL_MOISTURE_LOW:'土壤湿度过低',
    SOIL_PH_HIGH:'土壤pH过高', SOIL_PH_LOW:'土壤pH过低',
};

function loadAlertList(page) {
    const gid = document.getElementById('alSearchGid').value;
    const status = document.getElementById('alSearchStatus').value;
    let url = `/api/alert-log/list?page=${page}&size=10`;
    if (gid) url += `&greenhouseId=${gid}`;
    if (status !== '') url += `&status=${status}`;

    API.get(url).then(res => {
        if (res.code !== 200) { toast(res.message, 'error'); return; }
        const d = res.data;
        const tbody = document.getElementById('alTableBody');
        if (!d.records || d.records.length === 0) {
            tbody.innerHTML = '<tr class="empty-row"><td colspan="8">暂无报警记录 👍</td></tr>';
        } else {
            tbody.innerHTML = d.records.map(r => `
                <tr>
                    <td>${r.id}</td><td>${r.greenhouseId}</td>
                    <td>${alertTypeMap[r.alertType] || r.alertType}</td>
                    <td>${r.message}</td>
                    <td><span class="tag ${r.status===0?'tag-pending':'tag-done'}">${r.status===0?'未处理':'已处理'}</span></td>
                    <td>${formatTime(r.createTime)}</td>
                    <td>${formatTime(r.handleTime)}</td>
                    <td class="btn-group">
                        ${r.status===0 ? `<button class="btn btn-success btn-sm" onclick="handleAlert(${r.id})">✅ 处理</button>` : ''}
                        <button class="btn btn-danger btn-sm" onclick="deleteAlert(${r.id})">删除</button>
                    </td>
                </tr>`).join('');
        }
        renderPagination('alPagination', d.current, d.pages, loadAlertList);
    });
}

function handleAlert(id) {
    API.put(`/api/alert-log/${id}/handle`).then(res => {
        if (res.code === 200) { toast('报警已处理'); loadAlertList(1); }
        else toast(res.message, 'error');
    });
}

function deleteAlert(id) {
    if (!confirm('确定删除该报警记录吗？')) return;
    API.del(`/api/alert-log/${id}`).then(res => {
        if (res.code === 200) { toast('删除成功'); loadAlertList(1); }
        else toast(res.message, 'error');
    });
}

// ==================== 分页组件 ====================
function renderPagination(containerId, current, pages, loadFn) {
    const c = document.getElementById(containerId);
    if (!pages || pages <= 1) {
        c.innerHTML = `<span>共 1 页</span>`;
        return;
    }
    let html = '';
    html += `<button ${current<=1?'disabled':''} onclick="${loadFn.name}(${current-1})">上一页</button>`;
    for (let i = 1; i <= pages; i++) {
        html += `<button style="${i===current?'background:#1890ff;color:#fff;border-color:#1890ff':''}" onclick="${loadFn.name}(${i})">${i}</button>`;
    }
    html += `<button ${current>=pages?'disabled':''} onclick="${loadFn.name}(${current+1})">下一页</button>`;
    html += `<span>共 ${pages} 页</span>`;
    c.innerHTML = html;
}

// ==================== 启动：默认加载大棚管理 ====================
loadPage('greenhouse');
</script>
